name: SCHAGLK Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 34
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Verify Gradle wrapper
        run: |
          chmod +x gradlew
          test -f gradle/wrapper/gradle-wrapper.jar
          grep "gradle-9.5-bin.zip" gradle/wrapper/gradle-wrapper.properties
          ./gradlew --version

      - name: Validate SCHAGLK project
        run: |
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/schaglk/studio/MainActivity.java

      - name: Build SCHAGLK APK
        run: |
          ./gradlew :app:assembleDebug --stacktrace

      - name: Upload SCHAGLK APK
        uses: actions/upload-artifact@v4
        with:
          name: SCHAGLK-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
